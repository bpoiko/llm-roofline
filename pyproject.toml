[project]
name = "roofline-bench"
version = "0.1.0"
description = "LLM inference roofline study: measured decode/prefill vs memory-bandwidth ceilings"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "gguf>=0.10",
]

[project.optional-dependencies]
# Apple Silicon only: MLX speculation-off control + GPU bandwidth probe
mlx = ["mlx-lm>=0.20"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
