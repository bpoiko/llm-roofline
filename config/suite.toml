# Benchmark suite configuration, read by suite.py.
#
# Per-machine overrides: config/suite.<machine>.toml is merged over this file
# (tables merge key by key; arrays and scalars replace). Use it to add models that
# only fit on a bigger machine or to push depths further.

[suite]
reps = 3
num_predict = 512        # >= 512 so MTP draft depth ramp-up is a small share of decode
depths = [0, 4096, 16384]
prompts = ["counting", "essay", "random"]
cooldown_s = 5           # between runs, to keep thermals comparable
predict_depths = [0, 4096, 16384, 65536]

[ollama]
enabled = true
isolate = true           # unload before every run; MTP draft-depth state otherwise leaks between runs

[mlx]
enabled = true

[llamacpp]
enabled = true
depths = [0, 4096, 16384]
n_prompt = 512
n_gen = 128
reps = 5

# One entry per architecture. `label` ties the runtimes together in plots.
# gguf entries are "<hf repo>/<file>.gguf" (downloaded to the HF cache) or local paths.
[[model]]
label = "qwen3.5-9b"
hf_config = "Qwen/Qwen3.5-9B"
ollama = "qwen3.5:9b"
mlx = "mlx-community/Qwen3.5-9B-4bit"
# a quant ladder of one model sweeps bytes/token with everything else fixed
gguf = [
    "unsloth/Qwen3.5-9B-GGUF/Qwen3.5-9B-Q3_K_M.gguf",
    "unsloth/Qwen3.5-9B-GGUF/Qwen3.5-9B-Q4_K_M.gguf",
    "unsloth/Qwen3.5-9B-GGUF/Qwen3.5-9B-Q8_0.gguf",
]

[[model]]
label = "qwen3.6-27b"
hf_config = "Qwen/Qwen3.6-27B"
ollama = "qwen3.6:27b"
mlx = "mlx-community/Qwen3.6-27B-4bit"
gguf = []
